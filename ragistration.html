<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration</title>
    <link rel="stylesheet" href="registration.css">
</head>
<body>
    <div class="form_container">
        <img src="https://img.freepik.com/premium-vector/hotel-logo-icon-vector-hotel-logo-silhouette-building-vector-illustration_1199258-5038.jpg" alt="logo">
        <h1>Sign In</h1>
        <p>Register your account</p>
        <form action="register.php" method="POST">
            <input type="text" name="username" class="username" placeholder="Enter your username" required>
            <input type="email" name="email" class="email" placeholder="Email or phone" required>
            <input type="password" name="password" class="password" placeholder="Password" required>
            <a href="loginpage.html">Already Registered?</a>
            <button type="submit">Sign In</button>
        </form>
        

    </div>
</body>
</html>
